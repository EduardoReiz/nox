version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nox
      POSTGRES_PASSWORD: nox
      POSTGRES_DB: nox
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    ports: ["3333:3333"]
    depends_on: [db, redis]
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
volumes:
  db:
