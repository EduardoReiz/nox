version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nox
      POSTGRES_PASSWORD: nox
      POSTGRES_DB: nox
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, redis]
    ports: ["3333:3333"]
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      - VITE_API_URL=http://localhost:3333
    ports: ["5173:5173"]
volumes:
  db:
