[project]
name = "nox"
version = "0.1.0"
description = "Núcleo do Nox: ingestão de dados, indicadores, score e API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "influxdb-client>=1.44",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ta>=0.11", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
