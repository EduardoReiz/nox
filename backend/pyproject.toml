[project]
name = "nox"
version = "0.1.0"
description = "Núcleo do Nox: ingestão de dados, indicadores, score e API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pandas>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ta>=0.11"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
